name: Delete All Tags and Releases

on:
  workflow_dispatch: # Allows you to press a button to run this manually

jobs:
  clear-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch and Delete All Releases and Tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch every release tag name, loop through them, and delete both the release and its tag
          gh release list --limit 1000 | cut -f3 | while read -r release_tag; do
            if [ -n "$release_tag" ]; then
              echo "Deleting release and tag: $release_tag"
              gh release delete -y "$release_tag" --cleanup-tag
            fi
          done
